name: Build docker images

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # kézzel is lehessen indítani
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        # You may pin to the exact commit or the version.
        # uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        uses: docker/login-action@v4.8.0
        with:
          # Server address of Docker registry. If not set then will default to Docker Hub
          registry: ghcr.io
          # Username used to log against the Docker registry
          username: tbrjedlik
          # Password or personal access token used to log against the Docker registry
          password: ${{ secrets.GITHUB_TOKEN }}
          # Specifies whether the given registry is ECR (auto, true or false)
         
      - name: Build the Docker images
        run: |
          VERSION=$(date +%s)
          docker build ./backend --tag ghcr.io/tbrjedlik/kviz-backend:$VERSION
          docker build ./frontend --tag ghcr.io/tbrjedlik/kviz-frontend:$VERSION
          
